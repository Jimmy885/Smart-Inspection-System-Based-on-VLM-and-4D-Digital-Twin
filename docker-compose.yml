services:
  api:
    build: ./api
    container_name: VLM_api
    env_file: .env
    ports: ["8000:8000","5678:5678"]
    depends_on: [qdrant]
    volumes:
      - ./data:/app/data
      - ./data:/data 
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: ["python","-Xfrozen_modules=off","-m","debugpy","--listen","0.0.0.0:5678","-m","uvicorn","app:app","--host","0.0.0.0","--port","8000","--reload"]
    restart: unless-stopped
    networks:
      - vlm_network 

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports: ["6333:6333"]
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
    restart: unless-stopped
    networks:
      - vlm_network

  gradio:
    build: ./gradio
    container_name: VLM_gradio
    env_file: .env
    ports: ["7860:7860"]
    depends_on: [api]
    volumes:
      - ./data:/app/data
      - ./data/snapshots:/app/snapshots
      - ./data/4DGS:/app/4DGS
      - ./data/record:/app/record
    environment:
      - API_ENDPOINT=http://api:8000/analyze
    command: ["python", "gradio_app.py"]
    restart: unless-stopped
    networks:
      - vlm_network


networks:
  vlm_network:
    driver: bridge
